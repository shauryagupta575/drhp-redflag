# Install once with: uv run --directory backend pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app tests
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
